#####################################################################
#   print_start macro
#####################################################################
[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}


[gcode_macro FILTER_FAN_ON]
gcode:
  SET_FAN_SPEED FAN=_filter_fan SPEED=1.0

[gcode_macro FILTER_FAN_OFF]
gcode:
  SET_FAN_SPEED FAN=_filter_fan SPEED=0
  
[gcode_macro Level_Bed]
#rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    CLEAN_NOZZLE
    M109 S150
    Z_TILT_ADJUST
    G28 Z
    BED_MESH_CALIBRATE
    M104 S0

#[gcode_macro T3]
#gcode:
      
[gcode_macro M141]
gcode:
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan="exhaust_fan" target={target_chamber + 5}

[gcode_macro M191]
gcode:
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan="exhaust_fan" target={target_chamber + 5}

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state

    G91
    G92 E0
    G1 E350 F{max_velocity} # fast-load
    G1 E25 F{speed} # purge

    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    G91

    G92 E0
    G1 E25 F{speed} # purge
    G1 E-420 F{max_velocity} # fast-unload

    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro PRINT_START]
gcode:
  RESPOND TYPE=error MSG='Print Start'
  # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  RESET_ACCEL

  RESPOND TYPE=error MSG='Home Printer'
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90                   # Absolute position

  ##  Uncomment for bed mesh (1 of 2)
  BED_MESH_CLEAR       # Clears old saved bed mesh (if any)
  M104 S150
  # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
    RESPOND TYPE=error MSG='Heat Chamber'
    #SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    #STATUS_HEATING                                      # Sets SB-leds to heating-mode
    M106 S255                                           # Turns on the PT-fan
    AUX_FAN_ON
    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turns on the nevermore

    G1 X66 Y358.5 F24000 
    G1 Z5 F1500                   
    
    SET_LED LED="Chamber_LEDs" RED=1 GREEN=0.251 BLUE=0 SYNC=0 TRANSMIT=1
    M190 S{target_bed} # Sets the target temp for the bed
    #SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Displays info
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp
    AUX_FAN_OFF
  # If the bed temp is not over 90c, then it skips the heatsoak and just heats up to set temp with a 5min soak

  {% else %}
    RESPOND TYPE=error MSG='Heat Bed'
    G1 X266 Y358.5 F24000 
    G1 Z15 F1500                    # Goes to center of the bed
    SET_LED LED="Chamber_LEDs" RED=1 GREEN=0.251 BLUE=0 SYNC=0 TRANSMIT=1
    M190 S{target_bed}                                  # Sets the target temp for the bed
    #SET_DISPLAY_TEXT MSG="Soak for 5min"                # Displays info
    {% if params.BED|int > 50 %}
      RESPOND TYPE=error MSG='Heat Soak Bed'
      G4 P300000                                        # Waits 5 min for the bedtemp to stabilize
    {% endif %}
  {% endif %}

  SET_LED LED="Chamber_LEDs" RED=0 GREEN=1 BLUE=0 SYNC=0 TRANSMIT=1
  RESPOND TYPE=error MSG='Level_Bed'
  #BED_MESH_CALIBRATE
  Level_Bed
  BED_MESH_PROFILE LOAD=default

  G1 X175 Y175 F24000
  G1 Z15 F1500                              # Goes to center of the bed
  M107                                                          # Turns off partcooling fan
  RESPOND TYPE=error MSG='Park'
  SMART_PARK
  SET_LED LED="Chamber_LEDs" RED=1 GREEN=0.251 BLUE=0 SYNC=0 TRANSMIT=1
  M109 S{target_extruder}                                       # Heats the nozzle to printing temp

  SET_LED LED="Chamber_LEDs" RED=0.5 GREEN=0.5 BLUE=0.5 SYNC=0 TRANSMIT=1
  SET_LED LED="SB_LEDs" RED=0 GREEN=0 BLUE=0 WHITE=0.5 INDEX=9 SYNC=0 TRANSMIT=1
  SET_LED LED="SB_LEDs" RED=0 GREEN=0 BLUE=0 WHITE=0.5 INDEX=10 SYNC=0 TRANSMIT=1
  RESPOND TYPE=error MSG='Purge'
  LINE_PURGE
  
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning
    #G0 Z1 F1500
    #G0 X20.0 Y20.0 F12000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z10 F1500                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X175 Y350 F24000            ; park nozzle at rear
    BED_MESH_CLEAR
    SET_LED LED="Chamber_LEDs" RED=0.5 GREEN=0.5 BLUE=0.5 SYNC=0 TRANSMIT=1

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    SET_LED LED="Chamber_LEDs" RED=1 GREEN=1 BLUE=0 SYNC=0 TRANSMIT=1
    ##### set defaults #####
    {% set x = params.X|default(230) %}      #edit to your park position
    {% set y = params.Y|default(230) %}      #edit to your park position
    {% set z = params.Z|default(10)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}    
      G1 Z{z_safe}
      G90
      G1 X{x} Y{y} F12000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    SET_LED LED="Chamber_LEDs" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
    ##### set defaults #####
    {% set e = params.E|default(1) %} #edit to your retract length
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}  
    RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  BED_MESH_CLEAR
  TURN_OFF_HEATERS
  SET_LED LED="Chamber_LEDs" RED=1 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
  CANCEL_PRINT_BASE
  M400                           ; wait for buffer to clear
  G92 E0                         ; zero the extruder
  G1 E-10.0 F3600                ; retract filament
  G91                            ; relative positioning
  G0 Z10 F1500
  #G0 X5 Y5 F12000    ; move nozzle to remove stringing
  M107                           ; turn off fan
  #G1 Z10 F1500                    ; move nozzle up 2mm
  G90                            ; absolute positioning
  G0  X175 Y350 F24000            ; park nozzle at rear

