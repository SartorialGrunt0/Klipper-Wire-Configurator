[mcu host_mcu]
serial: /tmp/klipper_host_mcu

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_4D003A001851303439363932-if00
#serial: /dev/ttyAMA0
serial: /dev/ttyS0
baud: 250000
restart_method: command




[virtual_sdcard]
path: /home/clifgall/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

#restart_method: command

[printer]
kinematics: corexy
max_velocity: 600  
#max_accel: 4800 from IS Results
max_accel: 15500 #Ellis Tuned
max_z_velocity: 15			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[gcode_macro RESET_ACCEL]
gcode:
  {% set MAX_ACCEL = printer.configfile.settings['printer'].max_accel|int %}
  SET_VELOCITY_LIMIT ACCEL={MAX_ACCEL}
#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
rotation_distance: 40
microsteps: 16
#full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
#endstop_pin: ^PA1
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 40  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

#    Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PE7
interpolate: True
run_current: 1.1
#hold_current: 0.8
#sense_resistor: 0.110
#stealthchop_threshold: 0
diag_pin: ^PB14
#driver_SGTHRS: 79
#driver_SGTHRS: 89

[stepper_y]
##	Connected to Y-MOT (A Motor)
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
rotation_distance: 40
microsteps: 16
#full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
#endstop_pin: ^PA2 # Y-MAX
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 359
position_max: 359

##--------------------------------------------------------------------
homing_speed: 40  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

#	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PE15
interpolate: True
run_current: 1.1
#hold_current: 0.8
#sense_resistor: 0.110
#stealthchop_threshold: 0
diag_pin: ^PB13
#driver_SGTHRS: 97

[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
##T8x4 Lead Screws.  One rotation moves the bed 4mm 
##Change according to integrated steppers purchased
rotation_distance: 4
#full_steps_per_rotation: 200
microsteps: 16
##  In Z- Position
endstop_pin: probe: z_virtual_endstop

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
## All builds use same Max Z
position_max: 250
position_min: -10
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 5

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PD10
uart_address: 0
interpolate: True
run_current: 0.650
#hold_current: 0.4
#sense_resistor: 0.110
stealthchop_threshold: 0

##	In E2-MOT Position
##	Z1 Stepper - Z Rear Motor
[stepper_z1]
step_pin: PE6
dir_pin: !PC13
enable_pin: !PE5
rotation_distance: 4
#full_steps_per_rotation: 200
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: True
run_current: 0.650
#hold_current: 0.4
#sense_resistor: 0.110
stealthchop_threshold: 0

##	In E1-MOT Position
##	Z2 Stepper - Z Right Motor
[stepper_z2]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
rotation_distance: 4
#full_steps_per_rotation: 200
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PD7
interpolate: true
run_current: 0.650
#hold_current: 0.4
#sense_resistor: 0.110
stealthchop_threshold: 0

[extruder]
step_pin: EBBCan:gpio18
dir_pin: !EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
gear_ratio: 50:10
rotation_distance: 22
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan:gpio27
#control: pid
#pid_Kp: 30.699
#pid_Ki: 2.236
#pid_Kd: 101.305
min_temp: 0
max_temp: 300
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
#sense_resistor: 0.110
run_current: 0.650
interpolate: true
#stealthchop_threshold: 999999
#stealthchop_threshold: 0

#####################################################################
#	Probe
#####################################################################

[probe]
pin: ^EBBCan:gpio22
x_offset: 0
y_offset: 0
speed: 3
lift_speed: 7
samples:3
samples_result: median
sample_retract_dist: 0.8
samples_tolerance: 0.008 #0.006
samples_tolerance_retries: 3
#drop_first_result: true
#z_offset: -0.51

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M106 S255
        M109 S{ PROBE_TEMP }
        M106 S0
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: PB4
sensor_type: Generic 3950 #NTC 100K MGB18-104F39050L32
sensor_pin: PB0 # Spider v2.x
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.6
#pwm_cycle_time: 0.02227 # 44.9Hz
pwm_cycle_time: 0.02088 # 47.9Hz
min_temp: 0
max_temp: 120
control: pid
pid_kp = 40.772
pid_ki = 1.837
pid_kd = 226.287


#####################################################################
#	Fans
#####################################################################

[temperature_fan _electronics_fan]
pin: PB2
kick_start_time: 0.5
control: watermark # the type of hysteresis we are using
max_delta: 3.0 # fan turns on/off at 3° over/under target_temp
sensor_type: temperature_host # same as a temp_sensor
#sensor_mcu: mcu min_temp: 0
max_temp: 80 # just the valid temperature ranges
target_temp: 55 # the initial target temperature for the fan
min_temp:0
min_speed:0.3
max_speed:0.5

[controller_fan _stepper_fan]
pin: PA13
kick_start_time: 0.5
stepper: stepper_x, stepper_y
fan_speed: 1

[temperature_fan exhaust_fan]
pin: PC8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time:0.01
off_below:0.1
sensor_mcu: host_mcu
sensor_type: DS18B20
#serial_no: 28-3de10457d6b3
serial_no: 28-3de10457c629
min_temp: 0
max_temp: 70
target_temp: 35.0
control: watermark

[fan_generic _power_off]
pin: PB15
max_power: 1.0
shutdown_speed: 0
#cycle_time:
#hardware_pwm:
kick_start_time: 0.2
off_below: 0.25

#[temperature_sensor Raspberry_Pi]
#sensor_type: temperature_host
#min_temp: 0
#max_temp: 100

#####################################################################
# Filter Fan
#####################################################################

[fan_generic _filter_fan]
pin: PA14
max_power: 1.0
shutdown_speed: 0
#cycle_time:
#hardware_pwm:
kick_start_time: 0.2
off_below: 0.25

[gcode_macro FILTER_FAN_ON]
gcode:
  SET_FAN_SPEED FAN=_filter_fan SPEED=1.0

[gcode_macro FILTER_FAN_OFF]
gcode:
  SET_FAN_SPEED FAN=_filter_fan SPEED=0

